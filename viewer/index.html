<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <title>Tetris WSP — Builder Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 0%, #17233b, #090d16 58%); color: #edf3ff; }
    main { width: min(760px, calc(100% - 40px)); padding: 32px; border: 1px solid #293750; border-radius: 20px; background: #101827dd; box-shadow: 0 24px 80px #0008; }
    .eyebrow { color: #74e0c2; letter-spacing: .16em; font-size: 11px; font-weight: 700; }
    h1 { margin: 12px 0; font-size: clamp(30px, 6vw, 48px); letter-spacing: -.04em; }
    p { color: #aebbd0; line-height: 1.65; }
    .status { display: inline-flex; gap: 8px; align-items: center; margin-top: 12px; padding: 8px 12px; border: 1px solid #315c57; border-radius: 999px; color: #9aefd9; font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #5be0b5; box-shadow: 0 0 12px #5be0b5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">WEIGHT-SPACE PROGRAMMING EXPERIMENT</div>
    <h1>Tetris WSP</h1>
    <p>This is the repository bootstrap preview. The Codex Builder will replace this page with the two-panel Tetris gameplay and animated neural-network viewer.</p>
    <div class="status"><span class="dot"></span> Builder implementation pending</div>
  </main>
</body>
</html>
