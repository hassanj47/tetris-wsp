[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project]
name = "tetris-wsp"
version = "0.1.0"
description = "A reproducible weight-space programming demonstration using Tetris"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
